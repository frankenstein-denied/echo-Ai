<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
<title>Echo — Legacy policy (wireframe)</title>
<desc>Team: Peter Paul Poloan — Front End, Back End, Q/A, UI/UX Designer, Documentator (one-member group)</desc>
<g id="policy-editor"><rect x="0" y="0" width="390" height="844" rx="0" fill="#0b0f14" stroke="#0b0f14" stroke-width="1"/><g id="status-bar"><text x="20" y="30" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e6eaf0" text-anchor="start"><tspan x="20" dy="0">9:41</tspan></text><text x="370" y="30" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#9aa4b2" text-anchor="end"><tspan x="370" dy="0">●●● 100%</tspan></text></g><g id="header"><rect x="0" y="44" width="390" height="56" rx="0" fill="#0b0f14" stroke="#0b0f14" stroke-width="1"/><circle cx="34" cy="72" r="11" fill="#0f2e2b" stroke="#2dd4bf"/><circle cx="34" cy="72" r="4" fill="#2dd4bf"/><text x="54" y="70" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#9aa4b2" text-anchor="start"><tspan x="54" dy="0">Legacy</tspan></text><text x="54" y="87" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#e6eaf0" text-anchor="start"><tspan x="54" dy="0">Legacy policy</tspan></text><line x1="0" y1="100" x2="390" y2="100" stroke="#232b36"/></g><g id="content"><g id="policy-status"><text x="20" y="126" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#9aa4b2" text-anchor="start"><tspan x="20" dy="0">Editable while you use Echo. Locks when your legacy is</tspan><tspan x="20" dy="17.4">released.</tspan></text></g><g id="code-editor"><rect x="20" y="168" width="350" height="250" rx="12" fill="#181f28" stroke="#6b7684" stroke-width="1"/><text x="42" y="194" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#6b7684" text-anchor="end"><tspan x="42" dy="0">1</tspan></text><text x="52" y="194" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#e6eaf0" text-anchor="start"><tspan x="52" dy="0">protocol maria:</tspan></text><text x="42" y="220" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#6b7684" text-anchor="end"><tspan x="42" dy="0">2</tspan></text><text x="52" y="220" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#e6eaf0" text-anchor="start"><tspan x="52" dy="0">  may see existence of entries mentioning maria</tspan></text><rect x="21" y="229" width="348" height="24" fill="#2e1112"/><text x="42" y="246" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#6b7684" text-anchor="end"><tspan x="42" dy="0">3</tspan></text><text x="52" y="246" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#e6eaf0" text-anchor="start"><tspan x="52" dy="0">  may @read summary of entries tagged &quot;family&quot;</tspan></text><text x="42" y="272" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#6b7684" text-anchor="end"><tspan x="42" dy="0">4</tspan></text><text x="52" y="272" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#e6eaf0" text-anchor="start"><tspan x="52" dy="0">release letter &quot;To my daughter&quot; to maria</tspan></text><text x="42" y="298" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#6b7684" text-anchor="end"><tspan x="42" dy="0">5</tspan></text><text x="52" y="298" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#e6eaf0" text-anchor="start"><tspan x="52" dy="0">    when date &gt;= 2040-05-01</tspan></text><text x="42" y="324" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#6b7684" text-anchor="end"><tspan x="42" dy="0">6</tspan></text><text x="52" y="324" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#e6eaf0" text-anchor="start"><tspan x="52" dy="0">transfer custody to adam_jr</tspan></text><text x="42" y="350" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#6b7684" text-anchor="end"><tspan x="42" dy="0">7</tspan></text><text x="52" y="350" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#e6eaf0" text-anchor="start"><tspan x="52" dy="0">    if trustee unavailable for 90 days</tspan></text><text x="42" y="376" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#6b7684" text-anchor="end"><tspan x="42" dy="0">8</tspan></text><text x="52" y="376" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#e6eaf0" text-anchor="start"><tspan x="52" dy="0">default writing mode: light_fix</tspan></text><line x1="94" y1="250" x2="102" y2="250" stroke="#ef4444" stroke-width="2"/></g><g id="syntax-error"><rect x="20" y="430" width="350" height="58" rx="10" fill="#2e1112" stroke="#ef4444" stroke-width="1"/><text x="36" y="452" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#ef4444" text-anchor="start"><tspan x="36" dy="0">Line 3, column 7: Unknown character &quot;@&quot;</tspan></text><text x="36" y="474" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#e6eaf0" text-anchor="start"><tspan x="36" dy="0">Fix the highlighted line, then check again.</tspan></text></g><g id="compiled-summary"><text x="20" y="512" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#9aa4b2" text-anchor="start"><tspan x="20" dy="0">After a successful check you will see, in plain words:</tspan></text><text x="20" y="532" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#e6eaf0" text-anchor="start" font-style="italic"><tspan x="20" dy="0">“Maria can learn which entries mention her and read</tspan><tspan x="20" dy="17.4">summaries of family entries. The letter “To my daughter”</tspan><tspan x="20" dy="17.4">opens for her on 1 May 2040.”</tspan></text></g><g id="legal-disclaimer"><rect x="20" y="600" width="350" height="81" rx="10" fill="#2e2208" stroke="#f59e0b" stroke-width="1"/><text x="34" y="620" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f59e0b" text-anchor="start"><tspan x="34" dy="0">Not a legal will</tspan></text><text x="34" y="638" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#e6eaf0" text-anchor="start"><tspan x="34" dy="0">A Letter of Wishes is a personal message, not a</tspan><tspan x="34" dy="16.675">legal will. It has no legal effect under Philippine</tspan><tspan x="34" dy="16.675">law and is not legal advice.</tspan></text></g><g id="button-check"><rect x="20" y="695" width="168" height="44" rx="10" fill="#181f28" stroke="#313b48" stroke-width="1"/><text x="104" y="722" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#e6eaf0" text-anchor="middle"><tspan x="104" dy="0">Check</tspan></text></g><g id="button-save-policy"><rect x="202" y="695" width="168" height="44" rx="10" fill="#2dd4bf" stroke="#2dd4bf" stroke-width="1"/><text x="286" y="722" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#04201c" text-anchor="middle"><tspan x="286" dy="0">Save policy</tspan></text></g></g><g id="tab-bar"><rect x="0" y="772" width="390" height="72" rx="0" fill="#12171e" stroke="#232b36" stroke-width="1"/><circle cx="49" cy="796" r="9" fill="none" stroke="#9aa4b2" stroke-width="1.8"/><text x="49" y="824" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="49" dy="0">Today</tspan></text><circle cx="146" cy="796" r="9" fill="none" stroke="#9aa4b2" stroke-width="1.8"/><text x="146" y="824" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="146" dy="0">Notes</tspan></text><circle cx="243" cy="796" r="9" fill="none" stroke="#9aa4b2" stroke-width="1.8"/><text x="243" y="824" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="243" dy="0">Reminders</tspan></text><circle cx="340" cy="796" r="9" fill="none" stroke="#2dd4bf" stroke-width="1.8"/><text x="340" y="824" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#2dd4bf" text-anchor="middle"><tspan x="340" dy="0">More</tspan></text></g></g>
</svg>
