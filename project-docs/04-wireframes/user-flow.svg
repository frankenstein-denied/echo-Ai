<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="750" viewBox="0 0 1500 750">
<title>Echo Legacy — user flow</title>
<desc>Team: Peter Paul Poloan — Front End, Back End, Q/A, UI/UX Designer, Documentator (one-member group)</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa4b2"/></marker></defs>
<g id="user-flow"><rect x="0" y="0" width="1500" height="750" rx="0" fill="#0b0f14" stroke="#0b0f14" stroke-width="1"/><text x="40" y="50" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700" fill="#e6eaf0" text-anchor="start"><tspan x="40" dy="0">Echo Legacy — user flow</tspan></text><text x="40" y="76" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="400" fill="#9aa4b2" text-anchor="start"><tspan x="40" dy="0">How the owner and a registered asker move through the system. Numbers match the wireframe files.</tspan></text><g id="lane-owner"><rect x="20" y="100" width="1460" height="270" rx="12" fill="#12171e" stroke="#232b36" stroke-width="1"/><text x="40" y="128" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#2dd4bf" text-anchor="start"><tspan x="40" dy="0">OWNER (e.g. Ramon)</tspan></text><g id="o-signin"><rect x="40" y="150" width="170" height="56" rx="12" fill="#181f28" stroke="#313b48" stroke-width="1"/><text x="125" y="173" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e6eaf0" text-anchor="middle"><tspan x="125" dy="0">01 Sign in</tspan></text></g><g id="o-list"><rect x="260" y="150" width="170" height="56" rx="12" fill="#181f28" stroke="#313b48" stroke-width="1"/><text x="345" y="173" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e6eaf0" text-anchor="middle"><tspan x="345" dy="0">03 Entry list</tspan></text></g><g id="o-write"><rect x="480" y="150" width="170" height="56" rx="12" fill="#181f28" stroke="#313b48" stroke-width="1"/><text x="565" y="173" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e6eaf0" text-anchor="middle"><tspan x="565" dy="0">02 Write entry</tspan></text></g><g id="o-mode"><rect x="700" y="150" width="170" height="56" rx="12" fill="#181f28" stroke="#313b48" stroke-width="1"/><text x="785" y="173" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e6eaf0" text-anchor="middle"><tspan x="785" dy="0">Choose mode</tspan></text><text x="785" y="192" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="785" dy="0">verbatim · light fix · review</tspan></text></g><g id="o-saved"><rect x="920" y="150" width="170" height="56" rx="12" fill="#0e2a1b" stroke="#22c55e" stroke-width="1"/><text x="1005" y="173" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e6eaf0" text-anchor="middle"><tspan x="1005" dy="0">Saved to hash chain</tspan></text><text x="1005" y="192" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="1005" dy="0">original kept</tspan></text></g><g id="o-policy"><rect x="480" y="270" width="170" height="56" rx="12" fill="#181f28" stroke="#313b48" stroke-width="1"/><text x="565" y="293" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e6eaf0" text-anchor="middle"><tspan x="565" dy="0">04 Policy editor</tspan></text></g><g id="o-check"><rect x="700" y="270" width="170" height="56" rx="12" fill="#181f28" stroke="#313b48" stroke-width="1"/><text x="785" y="293" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e6eaf0" text-anchor="middle"><tspan x="785" dy="0">Check policy</tspan></text><text x="785" y="312" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="785" dy="0">lexer → parser</tspan></text></g><g id="o-error"><rect x="920" y="270" width="170" height="56" rx="12" fill="#2e1112" stroke="#ef4444" stroke-width="1"/><text x="1005" y="293" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e6eaf0" text-anchor="middle"><tspan x="1005" dy="0">Syntax error</tspan></text><text x="1005" y="312" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="1005" dy="0">line + column shown</tspan></text></g><g id="o-ok"><rect x="1140" y="270" width="170" height="56" rx="12" fill="#0e2a1b" stroke="#22c55e" stroke-width="1"/><text x="1225" y="293" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e6eaf0" text-anchor="middle"><tspan x="1225" dy="0">Policy saved</tspan></text><text x="1225" y="312" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="1225" dy="0">compiled to Prolog facts</tspan></text></g><g id="o-locked"><rect x="1140" y="150" width="170" height="56" rx="12" fill="#2e2208" stroke="#f59e0b" stroke-width="1"/><text x="1225" y="173" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e6eaf0" text-anchor="middle"><tspan x="1225" dy="0">Death trigger fires</tspan></text><text x="1225" y="192" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="1225" dy="0">policy frozen</tspan></text></g><path d="M 210 178 L 258 178" stroke="#9aa4b2" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><path d="M 430 178 L 478 178" stroke="#9aa4b2" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><text x="454" y="172" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="454" dy="0">+ Write</tspan></text><path d="M 650 178 L 698 178" stroke="#9aa4b2" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><path d="M 870 178 L 918 178" stroke="#9aa4b2" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><text x="894" y="172" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="894" dy="0">Save</tspan></text><path d="M 1090 178 L 1138 178" stroke="#9aa4b2" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><text x="1114" y="172" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="1114" dy="0">inactivity</tspan></text><path d="M 345 206 L 478 290" stroke="#9aa4b2" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><text x="411.5" y="242" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="411.5" dy="0">Legacy</tspan></text><path d="M 650 298 L 698 298" stroke="#9aa4b2" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><path d="M 870 298 L 918 298" stroke="#9aa4b2" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><text x="894" y="292" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="894" dy="0">invalid</tspan></text><path d="M 1005 326 Q 800 360 700 326" stroke="#9aa4b2" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><text x="860" y="356" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="860" dy="0">fix and retry</tspan></text><path d="M 785 270 Q 960 230 1138 290" stroke="#9aa4b2" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><text x="960" y="240" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="960" dy="0">valid</tspan></text></g><g id="lane-asker"><rect x="20" y="390" width="1460" height="330" rx="12" fill="#12171e" stroke="#232b36" stroke-width="1"/><text x="40" y="418" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f472b6" text-anchor="start"><tspan x="40" dy="0">REGISTERED ASKER (e.g. Maria) — only after the death trigger</tspan></text><g id="a-signin"><rect x="40" y="450" width="170" height="56" rx="12" fill="#181f28" stroke="#313b48" stroke-width="1"/><text x="125" y="473" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e6eaf0" text-anchor="middle"><tspan x="125" dy="0">01 Sign in</tspan></text></g><g id="a-ask"><rect x="260" y="450" width="170" height="56" rx="12" fill="#181f28" stroke="#313b48" stroke-width="1"/><text x="345" y="473" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e6eaf0" text-anchor="middle"><tspan x="345" dy="0">05 Ask a question</tspan></text></g><g id="a-check"><rect x="480" y="450" width="170" height="56" rx="12" fill="#0f1f33" stroke="#60a5fa" stroke-width="1"/><text x="565" y="473" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e6eaf0" text-anchor="middle"><tspan x="565" dy="0">Access check</tspan></text><text x="565" y="492" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="565" dy="0">Prolog rules + tools</tspan></text></g><g id="a-cited"><rect x="760" y="430" width="190" height="56" rx="12" fill="#0e2a1b" stroke="#22c55e" stroke-width="1"/><text x="855" y="453" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e6eaf0" text-anchor="middle"><tspan x="855" dy="0">06 Cited answer</tspan></text><text x="855" y="472" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="855" dy="0">entries cited by date</tspan></text></g><g id="a-release"><rect x="760" y="500" width="190" height="56" rx="12" fill="#2e2208" stroke="#f59e0b" stroke-width="1"/><text x="855" y="523" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e6eaf0" text-anchor="middle"><tspan x="855" dy="0">08 Release date not reached</tspan></text><text x="855" y="542" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="855" dy="0">letter sealed</tspan></text></g><g id="a-neutral"><rect x="760" y="570" width="190" height="56" rx="12" fill="#181f28" stroke="#313b48" stroke-width="1"/><text x="855" y="593" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e6eaf0" text-anchor="middle"><tspan x="855" dy="0">09 Neutral reply</tspan></text><text x="855" y="612" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="855" dy="0">nothing to share</tspan></text></g><g id="a-denied"><rect x="760" y="640" width="190" height="56" rx="12" fill="#2e1112" stroke="#ef4444" stroke-width="1"/><text x="855" y="663" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e6eaf0" text-anchor="middle"><tspan x="855" dy="0">07 Access denied</tspan></text><text x="855" y="682" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="855" dy="0">no names, no details</tspan></text></g><g id="a-letter"><rect x="1020" y="430" width="190" height="56" rx="12" fill="#0e2a1b" stroke="#22c55e" stroke-width="1"/><text x="1115" y="453" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e6eaf0" text-anchor="middle"><tspan x="1115" dy="0">Letter shown verbatim</tspan></text><text x="1115" y="472" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="1115" dy="0">on/after release date</tspan></text></g><path d="M 210 478 L 258 478" stroke="#9aa4b2" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><path d="M 430 478 L 478 478" stroke="#9aa4b2" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><path d="M 650 470 L 758 458" stroke="#9aa4b2" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><text x="704" y="458" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="704" dy="0">allowed</tspan></text><path d="M 650 482 L 758 526" stroke="#9aa4b2" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><text x="704" y="498" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="704" dy="0">too early</tspan></text><path d="M 650 494 L 758 596" stroke="#9aa4b2" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><text x="704" y="539" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="704" dy="0">nothing allowed or no protocol</tspan></text><g id="a-open"><rect x="480" y="640" width="170" height="56" rx="12" fill="#181f28" stroke="#313b48" stroke-width="1"/><text x="565" y="663" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e6eaf0" text-anchor="middle"><tspan x="565" dy="0">Opens an item directly</tspan></text><text x="565" y="682" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="565" dy="0">old link, not shared</tspan></text></g><path d="M 650 668 L 758 668" stroke="#9aa4b2" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><text x="704" y="662" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="704" dy="0">not shared</tspan></text><path d="M 950 458 L 1018 458" stroke="#9aa4b2" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><text x="984" y="452" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="984" dy="0">letter</tspan></text></g><g id="legend"><text x="1240" y="470" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#e6eaf0" text-anchor="start"><tspan x="1240" dy="0">Every answer is grounded:</tspan></text><text x="1240" y="490" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#9aa4b2" text-anchor="start"><tspan x="1240" dy="0">only permitted entries reach</tspan></text><text x="1240" y="508" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#9aa4b2" text-anchor="start"><tspan x="1240" dy="0">the model, and the disclaimer</tspan></text><text x="1240" y="526" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#9aa4b2" text-anchor="start"><tspan x="1240" dy="0">shows wherever a letter does.</tspan></text></g></g>
</svg>
