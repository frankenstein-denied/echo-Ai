<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
<title>Echo — Legacy (wireframe)</title>
<desc>Team: Peter Paul Poloan — Front End, Back End, Q/A, UI/UX Designer, Documentator (one-member group)</desc>
<g id="access-denied"><rect x="0" y="0" width="390" height="844" rx="0" fill="#0b0f14" stroke="#0b0f14" stroke-width="1"/><g id="status-bar"><text x="20" y="30" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e6eaf0" text-anchor="start"><tspan x="20" dy="0">9:41</tspan></text><text x="370" y="30" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#9aa4b2" text-anchor="end"><tspan x="370" dy="0">●●● 100%</tspan></text></g><g id="header"><rect x="0" y="44" width="390" height="56" rx="0" fill="#0b0f14" stroke="#0b0f14" stroke-width="1"/><circle cx="34" cy="72" r="11" fill="#0f2e2b" stroke="#2dd4bf"/><circle cx="34" cy="72" r="4" fill="#2dd4bf"/><text x="54" y="70" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#9aa4b2" text-anchor="start"><tspan x="54" dy="0">Legacy</tspan></text><text x="54" y="87" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#e6eaf0" text-anchor="start"><tspan x="54" dy="0">Legacy</tspan></text><line x1="0" y1="100" x2="390" y2="100" stroke="#232b36"/></g><g id="content"><circle cx="195" cy="250" r="54" fill="#2e1112" stroke="#ef4444" stroke-width="2"/><g id="icon-lock" transform="translate(195 250) scale(1.6)"><rect x="-11" y="-2" width="22" height="16" rx="3" fill="none" stroke="#ef4444" stroke-width="2"/><path d="M -6 -2 V -7 A 6 6 0 0 1 6 -7 V -2" fill="none" stroke="#ef4444" stroke-width="2"/></g><text x="195" y="350" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#e6eaf0" text-anchor="middle"><tspan x="195" dy="0">You don’t have access to this</tspan></text><text x="195" y="384" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="195" dy="0">This part of Ramon’s diary is shared only</tspan><tspan x="195" dy="20.3">with the people he chose. Your account isn’t</tspan><tspan x="195" dy="20.3">one of them.</tspan></text><g id="help"><rect x="20" y="470" width="350" height="76" rx="12" fill="#12171e" stroke="#232b36" stroke-width="1"/><text x="36" y="496" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e6eaf0" text-anchor="start"><tspan x="36" dy="0">Think this is a mistake?</tspan></text><text x="36" y="518" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#9aa4b2" text-anchor="start"><tspan x="36" dy="0">Contact the trustee, Lito Santos. Echo cannot</tspan><tspan x="36" dy="18.125">change what Ramon decided.</tspan></text></g><g id="button-back-to-my-legacies"><rect x="20" y="566" width="350" height="44" rx="10" fill="#181f28" stroke="#313b48" stroke-width="1"/><text x="195" y="593" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#e6eaf0" text-anchor="middle"><tspan x="195" dy="0">Back to My legacies</tspan></text></g><g id="annotation"><rect x="20" y="676" width="350" height="74" rx="10" fill="#0f1f33" stroke="#60a5fa" stroke-width="1" stroke-dasharray="4 3"/><text x="34" y="698" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#e6eaf0" text-anchor="start"><tspan x="34" dy="0">Shown for AccessDenied. The same screen appears</tspan><tspan x="34" dy="16.675">whether or not the item exists, so it never reveals</tspan><tspan x="34" dy="16.675">hidden entries.</tspan></text></g></g><g id="tab-bar"><rect x="0" y="772" width="390" height="72" rx="0" fill="#12171e" stroke="#232b36" stroke-width="1"/><circle cx="49" cy="796" r="9" fill="none" stroke="#9aa4b2" stroke-width="1.8"/><text x="49" y="824" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="49" dy="0">Today</tspan></text><circle cx="146" cy="796" r="9" fill="none" stroke="#9aa4b2" stroke-width="1.8"/><text x="146" y="824" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="146" dy="0">Notes</tspan></text><circle cx="243" cy="796" r="9" fill="none" stroke="#9aa4b2" stroke-width="1.8"/><text x="243" y="824" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="243" dy="0">Reminders</tspan></text><circle cx="340" cy="796" r="9" fill="none" stroke="#2dd4bf" stroke-width="1.8"/><text x="340" y="824" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#2dd4bf" text-anchor="middle"><tspan x="340" dy="0">More</tspan></text></g></g>
</svg>
