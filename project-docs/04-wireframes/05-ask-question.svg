<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
<title>Echo — Ramon Dela Cruz (wireframe)</title>
<desc>Team: Peter Paul Poloan — Front End, Back End, Q/A, UI/UX Designer, Documentator (one-member group)</desc>
<g id="ask-question"><rect x="0" y="0" width="390" height="844" rx="0" fill="#0b0f14" stroke="#0b0f14" stroke-width="1"/><g id="status-bar"><text x="20" y="30" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e6eaf0" text-anchor="start"><tspan x="20" dy="0">9:41</tspan></text><text x="370" y="30" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#9aa4b2" text-anchor="end"><tspan x="370" dy="0">●●● 100%</tspan></text></g><g id="header"><rect x="0" y="44" width="390" height="56" rx="0" fill="#0b0f14" stroke="#0b0f14" stroke-width="1"/><circle cx="34" cy="72" r="11" fill="#0f2e2b" stroke="#2dd4bf"/><circle cx="34" cy="72" r="4" fill="#2dd4bf"/><text x="54" y="70" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#9aa4b2" text-anchor="start"><tspan x="54" dy="0">Legacy</tspan></text><text x="54" y="87" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#e6eaf0" text-anchor="start"><tspan x="54" dy="0">Ramon Dela Cruz</tspan></text><line x1="0" y1="100" x2="390" y2="100" stroke="#232b36"/></g><g id="content"><g id="released-banner"><rect x="20" y="114" width="350" height="66" rx="10" fill="#0f2e2b" stroke="#2dd4bf" stroke-width="1"/><text x="36" y="138" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#2dd4bf" text-anchor="start"><tspan x="36" dy="0">Released · You can ask about Ramon’s diary</tspan></text><text x="36" y="160" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#e6eaf0" text-anchor="start"><tspan x="36" dy="0">Answers come only from entries he shared with you.</tspan></text></g><g id="honesty-line"><text x="195" y="208" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="195" dy="0">✨ Echo, answering from Ramon’s diary · not Ramon</tspan></text></g><text x="20" y="252" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#9aa4b2" text-anchor="start"><tspan x="20" dy="0">Try asking</tspan></text><g id="suggestions"><rect x="20" y="264" width="350" height="42" rx="21" fill="#181f28" stroke="#232b36" stroke-width="1"/><text x="40" y="290" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#e6eaf0" text-anchor="start"><tspan x="40" dy="0">Did he ever write about me?</tspan></text><rect x="20" y="316" width="350" height="42" rx="21" fill="#181f28" stroke="#232b36" stroke-width="1"/><text x="40" y="342" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#e6eaf0" text-anchor="start"><tspan x="40" dy="0">What did he write about family?</tspan></text><rect x="20" y="368" width="350" height="42" rx="21" fill="#181f28" stroke="#232b36" stroke-width="1"/><text x="40" y="394" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#e6eaf0" text-anchor="start"><tspan x="40" dy="0">Show me the letter to my daughter</tspan></text></g><g id="empty-state"><text x="195" y="500" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="195" dy="0">Your conversation stays in your own account.</tspan></text></g><g id="composer"><rect x="0" y="688" width="390" height="84" rx="0" fill="#12171e" stroke="#232b36" stroke-width="1"/><rect x="16" y="702" width="300" height="46" rx="23" fill="#181f28" stroke="#6b7684" stroke-width="1"/><text x="36" y="731" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="400" fill="#6b7684" text-anchor="start"><tspan x="36" dy="0">Ask a question…</tspan></text><circle cx="347" cy="725" r="23" fill="#2dd4bf"/><path d="M 338 725 L 356 725 M 349 717 L 357 725 L 349 733" stroke="#04201c" stroke-width="2.4" fill="none"/></g></g><g id="tab-bar"><rect x="0" y="772" width="390" height="72" rx="0" fill="#12171e" stroke="#232b36" stroke-width="1"/><circle cx="49" cy="796" r="9" fill="none" stroke="#9aa4b2" stroke-width="1.8"/><text x="49" y="824" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="49" dy="0">Today</tspan></text><circle cx="146" cy="796" r="9" fill="none" stroke="#9aa4b2" stroke-width="1.8"/><text x="146" y="824" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="146" dy="0">Notes</tspan></text><circle cx="243" cy="796" r="9" fill="none" stroke="#9aa4b2" stroke-width="1.8"/><text x="243" y="824" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="243" dy="0">Reminders</tspan></text><circle cx="340" cy="796" r="9" fill="none" stroke="#2dd4bf" stroke-width="1.8"/><text x="340" y="824" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#2dd4bf" text-anchor="middle"><tspan x="340" dy="0">More</tspan></text></g></g>
