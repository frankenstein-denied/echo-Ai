<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
<title>Echo — Ramon Dela Cruz (high fidelity)</title>
<desc>Team: Peter Paul Poloan — Front End, Back End, Q/A, UI/UX Designer, Documentator (one-member group)</desc>
<g id="cited-answer"><rect x="0" y="0" width="390" height="844" rx="0" fill="#0b0f14" stroke="#0b0f14" stroke-width="1"/><g id="status-bar"><text x="20" y="30" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e6eaf0" text-anchor="start"><tspan x="20" dy="0">9:41</tspan></text><text x="370" y="30" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#9aa4b2" text-anchor="end"><tspan x="370" dy="0">●●● 100%</tspan></text></g><g id="header"><rect x="0" y="44" width="390" height="56" rx="0" fill="#0b0f14" stroke="#0b0f14" stroke-width="1"/><circle cx="34" cy="72" r="14" fill="#2dd4bf" opacity="0.12"/><circle cx="34" cy="72" r="11" fill="#0f2e2b" stroke="#2dd4bf"/><circle cx="34" cy="72" r="4" fill="#2dd4bf"/><text x="54" y="70" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#9aa4b2" text-anchor="start"><tspan x="54" dy="0">Legacy</tspan></text><text x="54" y="87" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#e6eaf0" text-anchor="start"><tspan x="54" dy="0">Ramon Dela Cruz</tspan></text><line x1="0" y1="100" x2="390" y2="100" stroke="#232b36"/></g><g id="content"><g id="question-1"><rect x="154" y="116" width="216" height="62" rx="16" fill="#0f2e2b" stroke="#0f2e2b" stroke-width="1"/><text x="170" y="142" font-family="Inter, system-ui, sans-serif" font-size="14.5" font-weight="400" fill="#e6eaf0" text-anchor="start"><tspan x="170" dy="0">What did he write about</tspan><tspan x="170" dy="21.025">family?</tspan></text></g><g id="answer-1"><rect x="20" y="190" width="300" height="169" rx="16" fill="#181f28" stroke="#181f28" stroke-width="1"/><text x="36" y="216" font-family="Inter, system-ui, sans-serif" font-size="14.5" font-weight="400" fill="#e6eaf0" text-anchor="start"><tspan x="36" dy="0">He wrote about family often. For</tspan><tspan x="36" dy="21.025">Maria’s 16th birthday there was ube</tspan><tspan x="36" dy="21.025">cake [2019-03-02]. He was proud when</tspan><tspan x="36" dy="21.025">she got into nursing [2020-08-09]</tspan><tspan x="36" dy="21.025">and passed the board exam</tspan><tspan x="36" dy="21.025">[2023-06-25], and he walked the</tspan><tspan x="36" dy="21.025">beach in Daet with her [2024-06-12].</tspan></text><rect x="20" y="367" width="98" height="28" rx="14" fill="#181f28" stroke="#232b36" stroke-width="1"/><text x="69" y="386" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#60a5fa" text-anchor="middle"><tspan x="69" dy="0">2019-03-02</tspan></text><rect x="126" y="367" width="98" height="28" rx="14" fill="#181f28" stroke="#232b36" stroke-width="1"/><text x="175" y="386" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#60a5fa" text-anchor="middle"><tspan x="175" dy="0">2020-08-09</tspan></text><rect x="20" y="401" width="98" height="28" rx="14" fill="#181f28" stroke="#232b36" stroke-width="1"/><text x="69" y="420" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#60a5fa" text-anchor="middle"><tspan x="69" dy="0">2023-06-25</tspan></text><rect x="126" y="401" width="98" height="28" rx="14" fill="#181f28" stroke="#232b36" stroke-width="1"/><text x="175" y="420" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#60a5fa" text-anchor="middle"><tspan x="175" dy="0">2024-06-12</tspan></text><text x="20" y="445" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#9aa4b2" text-anchor="start"><tspan x="20" dy="0">4 entries cited · summaries only</tspan></text></g><g id="question-2"><rect x="146" y="467" width="224" height="62" rx="16" fill="#0f2e2b" stroke="#0f2e2b" stroke-width="1"/><text x="162" y="493" font-family="Inter, system-ui, sans-serif" font-size="14.5" font-weight="400" fill="#e6eaf0" text-anchor="start"><tspan x="162" dy="0">Show me the letter to my</tspan><tspan x="162" dy="21.025">daughter</tspan></text></g><g id="letter-verbatim"><rect x="20" y="541" width="350" height="122" rx="12" fill="#12171e" stroke="#f59e0b" stroke-width="1"/><text x="36" y="565" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#f59e0b" text-anchor="start"><tspan x="36" dy="0">Letter of Wishes · “To my daughter”</tspan></text><text x="36" y="585" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#9aa4b2" text-anchor="start"><tspan x="36" dy="0">Written 2026-10-30 · opened 1 May 2040 · word for word</tspan></text><text x="36" y="609" font-family="Inter, system-ui, sans-serif" font-size="13.5" font-weight="400" fill="#e6eaf0" text-anchor="start" font-style="italic"><tspan x="36" dy="0">Anak, if you are reading this, it is already</tspan><tspan x="36" dy="19.575">May 2040. I am proud of the nurse you</tspan><tspan x="36" dy="19.575">became…</tspan></text></g><g id="legal-disclaimer"><rect x="20" y="673" width="350" height="81" rx="10" fill="#2e2208" stroke="#f59e0b" stroke-width="1"/><text x="34" y="693" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f59e0b" text-anchor="start"><tspan x="34" dy="0">Not a legal will</tspan></text><text x="34" y="711" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#e6eaf0" text-anchor="start"><tspan x="34" dy="0">A Letter of Wishes is a personal message, not a</tspan><tspan x="34" dy="16.675">legal will. It has no legal effect under Philippine</tspan><tspan x="34" dy="16.675">law and is not legal advice.</tspan></text></g></g><g id="tab-bar"><rect x="0" y="772" width="390" height="72" rx="0" fill="#12171e" stroke="#232b36" stroke-width="1"/><g id="icon-book-open" transform="translate(38 785) scale(0.9166666666666666)" fill="none" stroke="#9aa4b2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></g><text x="49" y="824" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="49" dy="0">Today</tspan></text><g id="icon-file-text" transform="translate(135 785) scale(0.9166666666666666)" fill="none" stroke="#9aa4b2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></g><text x="146" y="824" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="146" dy="0">Notes</tspan></text><g id="icon-bell" transform="translate(232 785) scale(0.9166666666666666)" fill="none" stroke="#9aa4b2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></g><text x="243" y="824" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="243" dy="0">Reminders</tspan></text><g id="icon-layout-grid" transform="translate(329 785) scale(0.9166666666666666)" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></g><text x="340" y="824" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#2dd4bf" text-anchor="middle"><tspan x="340" dy="0">More</tspan></text></g></g>
