<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
<title>Echo — Write entry (high fidelity)</title>
<desc>Team: Peter Paul Poloan — Front End, Back End, Q/A, UI/UX Designer, Documentator (one-member group)</desc>
<g id="write-entry-error"><rect x="0" y="0" width="390" height="844" rx="0" fill="#0b0f14" stroke="#0b0f14" stroke-width="1"/><g id="status-bar"><text x="20" y="30" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e6eaf0" text-anchor="start"><tspan x="20" dy="0">9:41</tspan></text><text x="370" y="30" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#9aa4b2" text-anchor="end"><tspan x="370" dy="0">●●● 100%</tspan></text></g><g id="header"><rect x="0" y="44" width="390" height="56" rx="0" fill="#0b0f14" stroke="#0b0f14" stroke-width="1"/><circle cx="34" cy="72" r="14" fill="#2dd4bf" opacity="0.12"/><circle cx="34" cy="72" r="11" fill="#0f2e2b" stroke="#2dd4bf"/><circle cx="34" cy="72" r="4" fill="#2dd4bf"/><text x="54" y="70" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#9aa4b2" text-anchor="start"><tspan x="54" dy="0">Diary</tspan></text><text x="54" y="87" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#e6eaf0" text-anchor="start"><tspan x="54" dy="0">Write entry</tspan></text><line x1="0" y1="100" x2="390" y2="100" stroke="#232b36"/></g><g id="content"><g id="error-banner"><rect x="20" y="116" width="350" height="132" rx="12" fill="#2e1112" stroke="#ef4444" stroke-width="1"/><g id="icon-circle-alert" transform="translate(36 132) scale(0.9166666666666666)" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></g><text x="68" y="148" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#ef4444" text-anchor="start"><tspan x="68" dy="0">Your saved entries were changed</tspan><tspan x="68" dy="20.3">outside Echo</tspan></text><text x="36" y="196" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#e6eaf0" text-anchor="star