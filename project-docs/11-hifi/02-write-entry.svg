<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
<title>Echo — Write entry (high fidelity)</title>
<desc>Team: Peter Paul Poloan — Front End, Back End, Q/A, UI/UX Designer, Documentator (one-member group)</desc>
<g id="write-entry"><rect x="0" y="0" width="390" height="844" rx="0" fill="#0b0f14" stroke="#0b0f14" stroke-width="1"/><g id="status-bar"><text x="20" y="30" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e6eaf0" text-anchor="start"><tspan x="20" dy="0">9:41</tspan></text><text x="370" y="30" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#9aa4b2" text-anchor="end"><tspan x="370" dy="0">●●● 100%</tspan></text></g><g id="header"><rect x="0" y="44" width="390" height="56" rx="0" fill="#0b0f14" stroke="#0b0f14" stroke-width="1"/><circle cx="34" cy="72" r="14" fill="#2dd4bf" opacity="0.12"/><circle cx="34" cy="72" r="11" fill="#0f2e2b" stroke="#2dd4bf"/><circle cx="34" cy="72" r="4" fill="#2dd4bf"/><text x="54" y="70" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#9aa4b2" text-anchor="start"><tspan x="54" dy="0">Diary</tspan></text><text x="54" y="87" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#e6eaf0" text-anchor="start"><tspan x="54" dy="0">Write entry</tspan></text><line x1="0" y1="100" x2="390" y2="100" stroke="#232b36"/></g><g id="content"><rect x="20" y="116" width="142.4" height="28" rx="14" fill="#181f28" stroke="#232b36" stroke-width="1"/><text x="91.2" y="135" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#9aa4b2" text-anchor="middle"><tspan x="91.2" dy="0">Fri, 28 Nov 2026</tspan></text><g id="entry-text"><rect x="20" y="156" width="350" height="170" rx="12" fill="#181f28" stroke="#6b7684" stroke-width="1"/><text x="36" y="184" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="400" fill="#e6eaf0" text-anchor="start"><tspan x="36" dy="0">i went to teh store with Maria today and</tspan><tspan x="36" dy="22.5">she said the the shelves look better</tspan><tspan x="36" dy="22.5">then last year</tspan></text><rect x="36" y="268" width="2" height="18" fill="#2dd4bf"/><text x="354" y="312" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#9aa4b2" text-anchor="end"><tspan x="354" dy="0">96 / 5000</tspan></text></g><text x="20" y="352" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#9aa4b2" text-anchor="start"><tspan x="20" dy="0">Tags</tspan></text><rect x="20" y="362" width="68.4" height="28" rx="14" fill="#181f28" stroke="#232b36" stroke-width="1"/><text x="54.2" y="381" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#9aa4b2" text-anchor="middle"><tspan x="54.2" dy="0">family</tspan></text><rect x="96.4" y="362" width="83.2" height="28" rx="14" fill="#181f28" stroke="#232b36" stroke-width="1"/><text x="138" y="381" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#9aa4b2" text-anchor="middle"><tspan x="138" dy="0">business</tspan></text><rect x="187.60000000000002" y="362" width="90.60000000000001" height="28" rx="14" fill="#181f28" stroke="#232b36" stroke-width="1"/><text x="232.90000000000003" y="381" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#9aa4b2" text-anchor="middle"><tspan x="232.90000000000003" dy="0">+ Add tag</tspan></text><text x="20" y="422" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="500" fill="#9aa4b2" text-anchor="start"><tspan x="20" dy="0">Writing mode</tspan></text><g id="writing-mode-picker"><rect x="20" y="432" width="350" height="42" rx="10" fill="#181f28" stroke="#232b36" stroke-width="1"/><text x="81" y="458" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="81" dy="0">Verbatim</tspan></text><rect x="138" y="436" width="114" height="34" rx="8" fill="#0f2e2b" stroke="#2dd4bf" stroke-width="1"/><text x="195" y="458" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#2dd4bf" text-anchor="middle"><tspan x="195" dy="0">Light fix</tspan></text><text x="309" y="458" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="309" dy="0">Review</tspan></text></g><text x="20" y="494" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#9aa4b2" text-anchor="start"><tspan x="20" dy="0">Light fix corrects spelling and capitals. Your original is</tspan><tspan x="20" dy="16.675">always kept.</tspan></text><g id="diff-preview"><rect x="20" y="518" width="350" height="148" rx="12" fill="#12171e" stroke="#232b36" stroke-width="1"/><text x="36" y="542" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#e6eaf0" text-anchor="start"><tspan x="36" dy="0">Preview of changes</tspan></text><text x="36" y="568" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#9aa4b2" text-anchor="start"><tspan x="36" dy="0">Fixes Echo will apply:</tspan></text><text x="36" y="596" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#e6eaf0" text-anchor="start"><tspan x="36" dy="0">i  →  I   ·   teh  →  the   ·   the the  →  the</tspan></text><text x="36" y="624" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#9aa4b2" text-anchor="start"><tspan x="36" dy="0">Final full stop added. Names and meaning untouched.</tspan></text><text x="36" y="650" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#22c55e" text-anchor="start"><tspan x="36" dy="0">Saved as: “I went to the store with Maria today…”</tspan></text></g><g id="button-cancel"><rect x="20" y="684" width="168" height="44" rx="10" fill="#181f28" stroke="#313b48" stroke-width="1"/><text x="104" y="711" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#e6eaf0" text-anchor="middle"><tspan x="104" dy="0">Cancel</tspan></text></g><g id="button-save-entry"><rect x="202" y="684" width="168" height="44" rx="10" fill="#2dd4bf" stroke="#2dd4bf" stroke-width="1"/><text x="286" y="711" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#04201c" text-anchor="middle"><tspan x="286" dy="0">Save entry</tspan></text></g><text x="195" y="752" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="195" dy="0">Saved entries cannot be edited or deleted (append-only).</tspan></text></g><g id="tab-bar"><rect x="0" y="772" width="390" height="72" rx="0" fill="#12171e" stroke="#232b36" stroke-width="1"/><g id="icon-book-open" transform="translate(38 785) scale(0.9166666666666666)" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></g><text x="49" y="824" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#2dd4bf" text-anchor="middle"><tspan x="49" dy="0">Today</tspan></text><g id="icon-file-text" transform="translate(135 785) scale(0.9166666666666666)" fill="none" stroke="#9aa4b2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></g><text x="146" y="824" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="146" dy="0">Notes</tspan></text><g id="icon-bell" transform="translate(232 785) scale(0.9166666666666666)" fill="none" stroke="#9aa4b2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></g><text x="243" y="824" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="243" dy="0">Reminders</tspan></text><g id="icon-layout-grid" transform="translate(329 785) scale(0.9166666666666666)" fill="none" stroke="#9aa4b2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></g><text x="340" y="824" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="340" dy="0">More</tspan></text></g></g>
</svg>
