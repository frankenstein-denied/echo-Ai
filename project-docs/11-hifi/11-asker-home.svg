<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
<title>Echo — My legacies (high fidelity)</title>
<desc>Team: Peter Paul Poloan — Front End, Back End, Q/A, UI/UX Designer, Documentator (one-member group)</desc>
<g id="asker-home"><rect x="0" y="0" width="390" height="844" rx="0" fill="#0b0f14" stroke="#0b0f14" stroke-width="1"/><g id="status-bar"><text x="20" y="30" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#e6eaf0" text-anchor="start"><tspan x="20" dy="0">9:41</tspan></text><text x="370" y="30" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#9aa4b2" text-anchor="end"><tspan x="370" dy="0">●●● 100%</tspan></text></g><g id="header"><rect x="0" y="44" width="390" height="56" rx="0" fill="#0b0f14" stroke="#0b0f14" stroke-width="1"/><circle cx="34" cy="72" r="14" fill="#2dd4bf" opacity="0.12"/><circle cx="34" cy="72" r="11" fill="#0f2e2b" stroke="#2dd4bf"/><circle cx="34" cy="72" r="4" fill="#2dd4bf"/><text x="54" y="70" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#9aa4b2" text-anchor="start"><tspan x="54" dy="0">Legacy</tspan></text><text x="54" y="87" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#e6eaf0" text-anchor="start"><tspan x="54" dy="0">My legacies</tspan></text><line x1="0" y1="100" x2="390" y2="100" stroke="#232b36"/></g><g id="content"><text x="20" y="132" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#9aa4b2" text-anchor="start"><tspan x="20" dy="0">Legacies shared with you</tspan></text><g id="legacy-ramon"><rect x="20" y="146" width="350" height="96" rx="12" fill="#0f2e2b" stroke="#2dd4bf" stroke-width="1"/><circle cx="56" cy="194" r="22" fill="#181f28" stroke="#2dd4bf"/><text x="56" y="200" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#2dd4bf" text-anchor="middle"><tspan x="56" dy="0">R</tspan></text><text x="92" y="184" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#e6eaf0" text-anchor="start"><tspan x="92" dy="0">Ramon Dela Cruz</tspan></text><text x="92" y="206" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#2dd4bf" text-anchor="start"><tspan x="92" dy="0">Released · you can ask about his diary</tspan></text><g id="icon-message-circle" transform="translate(334 182) scale(0.9166666666666666)" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719"/></g></g><g id="legacy-locked"><rect x="20" y="256" width="350" height="80" rx="12" fill="#12171e" stroke="#232b36" stroke-width="1"/><circle cx="56" cy="296" r="22" fill="#181f28" stroke="#232b36"/><g id="icon-lock" transform="translate(46 286) scale(0.8333333333333334)" fill="none" stroke="#9aa4b2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></g><text x="92" y="290" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#e6eaf0" text-anchor="start"><tspan x="92" dy="0">Lourdes Santos</tspan></text><text x="92" y="312" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#9aa4b2" text-anchor="start"><tspan x="92" dy="0">Locked · not released</tspan></text></g><text x="20" y="372" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#9aa4b2" text-anchor="start"><tspan x="20" dy="0">A legacy opens only after its owner’s legacy is</tspan><tspan x="20" dy="18.125">released. Echo never shows a countdown.</tspan></text></g><g id="tab-bar"><rect x="0" y="772" width="390" height="72" rx="0" fill="#12171e" stroke="#232b36" stroke-width="1"/><g id="icon-book-open" transform="translate(38 785) scale(0.9166666666666666)" fill="none" stroke="#9aa4b2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></g><text x="49" y="824" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="49" dy="0">Today</tspan></text><g id="icon-file-text" transform="translate(135 785) scale(0.9166666666666666)" fill="none" stroke="#9aa4b2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></g><text x="146" y="824" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="146" dy="0">Notes</tspan></text><g id="icon-bell" transform="translate(232 785) scale(0.9166666666666666)" fill="none" stroke="#9aa4b2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></g><text x="243" y="824" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="243" dy="0">Reminders</tspan></text><g id="icon-layout-grid" transform="translate(329 785) scale(0.9166666666666666)" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></g><text x="340" y="824" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#2dd4bf" text-anchor="middle"><tspan x="340" dy="0">More</tspan></text></g></g>
</svg>
