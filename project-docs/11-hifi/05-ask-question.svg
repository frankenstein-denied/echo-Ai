t x="16" y="702" width="300" height="46" rx="23" fill="#181f28" stroke="#6b7684" stroke-width="1"/><text x="36" y="731" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="400" fill="#6b7684" text-anchor="start"><tspan x="36" dy="0">Ask a question…</tspan></text><circle cx="347" cy="725" r="23" fill="#2dd4bf"/><g id="icon-send" transform="translate(336 714) scale(0.9166666666666666)" fill="none" stroke="#04201c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></g></g></g><g id="tab-bar"><rect x="0" y="772" width="390" height="72" rx="0" fill="#12171e" stroke="#232b36" stroke-width="1"/><g id="icon-book-open" transform="translate(38 785) scale(0.9166666666666666)" fill="none" stroke="#9aa4b2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></g><text x="49" y="824" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="49" dy="0">Today</tspan></text><g id="icon-file-text" transform="translate(135 785) scale(0.9166666666666666)" fill="none" stroke="#9aa4b2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></g><text x="146" y="824" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="146" dy="0">Notes</tspan></text><g id="icon-bell" transform="translate(232 785) scale(0.9166666666666666)" fill="none" stroke="#9aa4b2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></g><text x="243" y="824" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#9aa4b2" text-anchor="middle"><tspan x="243" dy="0">Reminders</tspan></text><g id="icon-layout-grid" transform="translate(329 785) scale(0.9166666666666666)" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></g><text x="340" y="824" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#2dd4bf" text-anchor="middle"><tspan x="340" dy="0">More</tspan></text></g></g>
